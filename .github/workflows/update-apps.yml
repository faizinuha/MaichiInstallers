name: Update App List

on:
  schedule:
    - cron: '0 0 * * 0'   # Tiap Minggu jam 00:00 UTC
  workflow_dispatch:        # Bisa trigger manual dari GitHub

jobs:
  update-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch app data dari Chocolatey API
        run: python3 scripts/fetch_winget.py
        # Kalau API gagal, script otomatis pakai cache (fallback)

      - name: Commit jika ada perubahan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/windows.json
          git diff --staged --quiet && echo "Tidak ada perubahan" || (
            git commit -m "chore: auto update app list $(date +'%Y-%m-%d')" &&
            git push
          )
